[workspace]
members = [
    "crates/katana-ui-core",
    "crates/katana-ui-core-storybook",
    "examples/kuc-consumer-app",
]
resolver = "2"

[workspace.package]
version = "0.3.9"
edition = "2024"
license = "MIT"
repository = "https://github.com/HiroyukiFuruno/katana-ui-core"
rust-version = "1.95.0"
authors = ["Hiroyuki Furuno"]

[workspace.dependencies]
katana-ui-core = { version = "0.3.9", path = "crates/katana-ui-core" }
cap-fs-ext = "4.0.3"
cap-std = "4.0.3"
cosmic-text = "0.19.0"
eframe = "0.36"
egui = "0.36"
hex = "0.4.3"
image = { version = "0.25.10", default-features = false, features = ["gif", "png"] }
minifb = "0.28.0"
resvg = "0.48"
same-file = "1.0.6"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tempfile = "3.27.0"
tiny-skia = "0.12"
unicode-segmentation = "1.13.3"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[profile.test]
opt-level = 2
